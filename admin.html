<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GITAM Marketplace - Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .back-button {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .login-box h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            background: #111827;
            color: white;
            margin-top: 10px;
        }

        .dashboard {
            display: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .stat-card h3 {
            margin: 0 0 8px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        .product-card {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
        }

        .product-image {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            background: #eee;
        }

        .no-image {
            width: 180px;
            height: 180px;
            background: #eee;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .product-info h2 {
            margin-top: 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .seller {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .approved {
            background: #d1fae5;
            color: #065f46;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .approve {
            background: #16a34a;
            color: white;
        }

        .reject {
            background: #dc2626;
            color: white;
        }

        .refresh {
            background: #2563eb;
            color: white;
            margin-bottom: 20px;
        }

        .logout {
            background: #6b7280;
            color: white;
            float: right;
        }

        .message {
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .product-card {
                grid-template-columns: 1fr;
            }

            .product-image,
            .no-image {
                width: 100%;
                height: 220px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        🛡️ GITAM Marketplace Admin
    </h1>

    <a
        href="/"
        class="back-button"
    >
        ← Marketplace
    </a>

</header>


<!-- LOGIN -->

<div
    id="loginSection"
    class="login-box"
>

    <h2>
        Admin Login
    </h2>

    <p>
        Enter your admin password.
    </p>

    <input
        type="password"
        id="adminPassword"
        placeholder="Admin password"
    >

    <button
        id="loginButton"
        class="login-button"
    >
        Login
    </button>

    <p
        id="loginMessage"
        style="color:red;"
    ></p>

</div>


<!-- DASHBOARD -->

<div
    id="dashboard"
    class="dashboard"
>

    <div class="container">

        <button
            id="logoutButton"
            class="logout"
        >
            Logout
        </button>

        <h2>
            Product Approval
        </h2>

        <div class="stats">

            <div class="stat-card">

                <h3>
                    Pending
                </h3>

                <div
                    id="pendingCount"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Approved
                </h3>

                <div
                    id="approvedCount"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Rejected
                </h3>

                <div
                    id="rejectedCount"
                    class="stat-number"
                >
                    0
                </div>

            </div>

        </div>


        <button
            id="refreshButton"
            class="refresh"
        >
            🔄 Refresh Products
        </button>


        <div
            id="productsList"
        ></div>

    </div>

</div>


<script>

    let adminPassword = "";

    const loginSection =
        document.getElementById("loginSection");

    const dashboard =
        document.getElementById("dashboard");

    const passwordInput =
        document.getElementById("adminPassword");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");

    const productsList =
        document.getElementById("productsList");


    // ===============================
    // LOGIN
    // ===============================

    loginButton.addEventListener(
        "click",
        async () => {

            const password =
                passwordInput.value.trim();

            if (!password) {

                loginMessage.textContent =
                    "Please enter password.";

                return;
            }

            try {

                const response =
                    await fetch(
                        "/api/admin/products",
                        {
                            headers: {
                                "x-admin-password":
                                    password
                            }
                        }
                    );

                if (!response.ok) {

                    loginMessage.textContent =
                        "Wrong admin password.";

                    return;
                }

                adminPassword = password;

                loginSection.style.display =
                    "none";

                dashboard.style.display =
                    "block";

                loadProducts();

            } catch (error) {

                loginMessage.textContent =
                    "Server connection error.";

            }

        }
    );


    // ===============================
    // LOAD PRODUCTS
    // ===============================

    async function loadProducts() {

        try {

            const response =
                await fetch(
                    "/api/admin/products",
                    {
                        headers: {
                            "x-admin-password":
                                adminPassword
                        }
                    }
                );

            if (!response.ok) {

                alert(
                    "Admin session expired."
                );

                logout();

                return;
            }

            const products =
                await response.json();

            updateStats(products);

            displayProducts(products);

        } catch (error) {

            console.error(error);

            productsList.innerHTML = `
                <div class="message">
                    Unable to load products.
                </div>
            `;

        }

    }


    // ===============================
    // STATS
    // ===============================

    function updateStats(products) {

        const pending =
            products.filter(
                p => p.status === "PENDING"
            ).length;

        const approved =
            products.filter(
                p => p.status === "APPROVED"
            ).length;

        const rejected =
            products.filter(
                p => p.status === "REJECTED"
            ).length;

        document.getElementById(
            "pendingCount"
        ).textContent = pending;

        document.getElementById(
            "approvedCount"
        ).textContent = approved;

        document.getElementById(
            "rejectedCount"
        ).textContent = rejected;

    }


    // ===============================
    // DISPLAY PRODUCTS
    // ===============================

    function displayProducts(products) {

        if (products.length === 0) {

            productsList.innerHTML = `
                <div class="message">
                    No products submitted yet.
                </div>
            `;

            return;
        }

        productsList.innerHTML = "";

        products.forEach(product => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";

            let imageHTML = `
                <div class="no-image">
                    📦
                </div>
            `;

            if (product.image) {

                imageHTML = `
                    <img
                        src="${product.image}"
                        class="product-image"
                        alt="Product"
                    >
                `;

            }


            let statusClass =
                product.status.toLowerCase();

            card.innerHTML = `

                <div>

                    ${imageHTML}

                </div>


                <div class="product-info">

                    <span class="status ${statusClass}">
                        ${product.status}
                    </span>

                    <h2>
                        ${escapeHTML(product.name)}
                    </h2>

                    <div class="price">
                        ₹${Number(product.price).toLocaleString("en-IN")}
                    </div>

                    <p>
                        <strong>Category:</strong>
                        ${escapeHTML(product.category)}
                    </p>

                    <p>
                        <strong>Description:</strong>
                        ${escapeHTML(product.description)}
                    </p>

                    <div class="seller">

                        <strong>Seller:</strong>
                        ${escapeHTML(product.seller_name || "")}

                        <br>

                        <strong>GITAM Email:</strong>
                        ${escapeHTML(product.seller_email || "")}

                        <br>

                        <strong>WhatsApp:</strong>
                        ${escapeHTML(product.seller_phone || "")}

                    </div>

                    ${
                        product.status === "PENDING"
                        ? `
                            <div class="actions">

                                <button
                                    class="approve"
                                    onclick="changeStatus(${product.id}, 'APPROVED')"
                                >
                                    ✅ Approve
                                </button>

                                <button
                                    class="reject"
                                    onclick="changeStatus(${product.id}, 'REJECTED')"
                                >
                                    ❌ Reject
                                </button>

                            </div>
                          `
                        : ""
                    }

                </div>
            `;

            productsList.appendChild(card);

        });

    }


    // ===============================
    // APPROVE / REJECT
    // ===============================

    async function changeStatus(
        id,
        status
    ) {

        const action =
            status === "APPROVED"
                ? "approve"
                : "reject";

        const confirmed =
            confirm(
                `Are you sure you want to ${action} this product?`
            );

        if (!confirmed) {
            return;
        }

        try {

            const response =
                await fetch(
                    `/api/admin/products/${id}/status`,
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "x-admin-password":
                                adminPassword
                        },

                        body: JSON.stringify({
                            status: status
                        })
                    }
                );

            const result =
                await response.json();

            if (!response.ok) {

                alert(
                    result.error ||
                    "Failed to update product."
                );

                return;
            }

            alert(
                status === "APPROVED"
                    ? "Product approved! 🟢"
                    : "Product rejected! 🔴"
            );

            loadProducts();

        } catch (error) {

            console.error(error);

            alert(
                "Unable to update product."
            );

        }

    }


    // ===============================
    // REFRESH
    // ===============================

    document
        .getElementById("refreshButton")
        .addEventListener(
            "click",
            loadProducts
        );


    // ===============================
    // LOGOUT
    // ===============================

    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            logout
        );


    function logout() {

        adminPassword = "";

        dashboard.style.display =
            "none";

        loginSection.style.display =
            "block";

        passwordInput.value = "";

        productsList.innerHTML = "";

    }


    // ===============================
    // ESCAPE HTML
    // ===============================

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>

</body>

</html>
